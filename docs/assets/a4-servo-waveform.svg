<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="530" viewBox="0 0 1000 530" role="img" aria-labelledby="title desc">
<title id="title">Servo control voltage at D9 relative to GND</title>
<desc id="desc">Four zoomed views of the Uno's 0 to 5 volt pulse train at 0, 9, 18 and 18.1 seconds. Pulses repeat about every 20 milliseconds. Their high time grows from 0.54 milliseconds to 1.47 and 2.40 milliseconds, then returns to 0.54 milliseconds when the loop repeats.</desc>
<style>
text{font-family:Arial,sans-serif;fill:#202a24}.heading{font-size:27px;font-weight:700}.subtitle{font-size:16px;fill:#4f5e55}.panel-title{font-size:17px;font-weight:700}.tick{font-size:13px;fill:#4f5e55}.axis{stroke:#68766d;stroke-width:1.25;fill:none}.grid{stroke:#dae2db;stroke-width:1;stroke-dasharray:4 4}.trace{stroke:#176949;stroke-width:2.6;fill:none;stroke-linejoin:round}
</style>
